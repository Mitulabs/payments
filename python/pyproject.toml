[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mitulabs-payments"
dynamic = ["version"]
description = "Monetize HTTP APIs with machine payments over MPP and x402."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3"]
django = ["django>=5"]
dev = [
  "fastapi==0.165.0",
  "flask==3.1.3",
  "django==6.1.3",
  "pytest==9.2.0",
  "mypy==2.4.1",
  "ruff==0.17.6",
  "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://github.com/Mitulabs/payments/tree/main/python"
Issues = "https://github.com/Mitulabs/payments/issues"

[tool.hatch.version]
path = "src/mitulabs_payments/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mitulabs_payments"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "T20"]   # S = bandit security checks, T20 = no print()
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and fixture keys are expected in tests

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
filterwarnings = [
  "error",
  # Starlette's TestClient prefers httpx2; this package and its tests use httpx.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
