# Publishes from CI only, with PyPI trusted publishing (no token). Tag as py/vX.Y.Z.
name: release-python

on:
  push:
    tags: ['py/v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches package version
        run: test "py/v$(python -c 'exec(open("src/mitulabs_payments/_version.py").read()); print(__version__)')" = "$GITHUB_REF_NAME"
      - run: pip install -e ".[dev]" build
      - run: ruff check . && ruff format --check . && mypy --strict src && pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
